<svg xmlns="http://www.w3.org/2000/svg"
     width="920" height="300" viewBox="0 0 920 300"
     role="img" aria-labelledby="title desc">
  <title id="title">Lighthouse key continuity map</title>
  <desc id="desc">BRIEF-F1 says Mara holds the only key. BRIEF-F2 says Ivo has never entered the lantern room. A transfer remains unresolved and is not added as canon.</desc>
  <rect x="20" y="20" width="880" height="260"
        fill="white" stroke="black"/>
  <text x="55" y="70" font-family="sans-serif"
        font-size="22">BRIEF-F1: Mara → ONLY KEY</text>
  <text x="55" y="140" font-family="sans-serif"
        font-size="22">BRIEF-F2: Ivo → NO KNOWN ACCESS</text>
  <line x1="420" y1="185" x2="720" y2="185"
        stroke="black" stroke-width="3"/>
  <text x="55" y="205" font-family="sans-serif"
        font-size="22">Transfer?</text>
  <text x="735" y="191" font-family="sans-serif"
        font-size="18">UNRESOLVED</text>
  <text x="55" y="255" font-family="sans-serif"
        font-size="16">Interpretive diagram. Adds no canon.</text>
</svg>
